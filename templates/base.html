{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PrepVerse{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Centralized System Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/_navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/_sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/_buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/_cards.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body {% if user.is_authenticated %}class="has-sidebar"{% endif %}>

    <!-- Modular Partial Components -->
    {% include 'partials/sidebar.html' %}
    {% include 'partials/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Global System JavaScript -->
    <script src="{% static 'js/base.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
