<div class="form-group {{ extra_class }}">
    {% if label %}
        <label for="{% if id %}{{ id }}{% elif name %}{{ name }}{% else %}field{% endif %}">{{ label }}</label>
    {% endif %}
    <input type="{{ type|default:'text' }}" 
           {% if name %}name="{{ name }}"{% endif %} 
           id="{% if id %}{{ id }}{% elif name %}{{ name }}{% else %}field{% endif %}" 
           class="form-control" 
           placeholder="{{ placeholder|default:'' }}" 
           value="{{ value|default:'' }}" 
           {% if required %}required{% endif %}
           {% if readonly %}readonly disabled{% endif %}
           {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}>
    {% if error %}
        <span class="field-error" style="color: var(--accent-rose); font-size: 0.75rem; margin-top: 4px; display: block;">{{ error }}</span>
    {% endif %}
</div>
