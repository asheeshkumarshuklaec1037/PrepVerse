<div class="form-group {{ extra_class }}">
    {% if label %}
        <label for="{{ id|default:name }}">{{ label }}</label>
    {% endif %}
    <input type="{{ type|default:'text' }}" 
           name="{{ name }}" 
           id="{{ id|default:name }}" 
           class="form-control" 
           placeholder="{{ placeholder }}" 
           value="{{ value }}" 
           {% if required %}required{% endif %}
           {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}>
    {% if error %}
        <span class="field-error" style="color: var(--accent-rose); font-size: 0.75rem; margin-top: 4px; display: block;">{{ error }}</span>
    {% endif %}
</div>
