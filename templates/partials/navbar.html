{% load static %}
<script>
  window._lastSidebarToggleTime = 0;
  window.togglePrepVerseSidebar = function(e) {
    var now = Date.now();
    if (now - window._lastSidebarToggleTime < 450) {
      if (e) { if (e.cancelable) e.preventDefault(); e.stopPropagation(); }
      return false;
    }
    window._lastSidebarToggleTime = now;

    if (e) {
      if (e.type === 'touchstart' && e.cancelable) { e.preventDefault(); }
      e.stopPropagation();
    }
    var sidebar = document.getElementById('sidebarMenu');
    var overlay = document.getElementById('sidebarOverlay');
    if (sidebar) sidebar.classList.toggle('active');
    if (overlay) overlay.classList.toggle('active');
    return false;
  };

  window.closePrepVerseSidebar = function(e) {
    if (e) { e.stopPropagation(); }
    var sidebar = document.getElementById('sidebarMenu');
    var overlay = document.getElementById('sidebarOverlay');
    if (sidebar) sidebar.classList.remove('active');
    if (overlay) overlay.classList.remove('active');
  };
</script>

<nav class="navbar" id="navbar">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div class="sidebar-hover-trigger" id="sidebarHoverTrigger" role="button" aria-label="Open Navigation Menu" tabindex="0" onclick="togglePrepVerseSidebar(event)" ontouchstart="togglePrepVerseSidebar(event)">
            <i class="fa-solid fa-bars-staggered"></i>
        </div>
        
        <a href="{% url 'home' %}" class="logo" aria-label="PrepVerse Home">
            <i class="fas fa-bolt"></i>
            <span>PrepVerse</span>
        </a>
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'courses' %}">Courses</a>
        <a href="{% url 'practice' %}">Practice</a>
        <a href="{% url 'mock_test' %}">Mock Test</a>
        <a href="{% url 'blog' %}">Blog</a>
        <a href="{% url 'recommended_books' %}">Prep Books</a>
        <a href="#">About</a>
    </div>

    <div class="nav-actions">
        <div class="search-trigger" role="button" aria-label="Search Platform" tabindex="0"><i class="fas fa-search"></i></div>
        {% if user.is_authenticated %}
            <div class="user-menu-container">
                <div class="user-avatar-btn" id="userAvatarBtn">
                    {% include 'partials/avatar.html' with size="36px" extra_class="navbar-avatar" %}
                </div>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <a href="{% url 'profile_edit' %}" class="user-dropdown-header">
                        <strong>{{ user.first_name }} {{ user.last_name }}</strong>
                        <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5); display: block; margin-top: 3px;">{{ user.email }}</span>
                    </a>
                    <a href="{% url 'logout' %}" class="user-dropdown-item logout-item">
                        <i class="fas fa-sign-out-alt"></i> Log Out
                    </a>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="login-btn">Log In</a>
        {% endif %}
    </div>
</nav>
