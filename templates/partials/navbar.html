{% load static %}
<nav class="navbar" id="navbar">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div class="sidebar-hover-trigger {% if not user.is_authenticated %}mobile-only-trigger{% endif %}" id="sidebarHoverTrigger">
            <i class="fas fa-bars"></i>
        </div>
        
        <a href="{% url 'home' %}" class="logo">
            <i class="fas fa-bolt"></i>
            <span>PrepVerse</span>
        </a>
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'courses' %}">Courses</a>
        <a href="{% url 'mock_test' %}">Mock Test</a>
        <a href="{% url 'blog' %}">Blog</a>
        <a href="{% url 'recommended_books' %}">Prep Books</a>
        <a href="#">About</a>
    </div>

    <div class="nav-actions">
        <div class="search-trigger"><i class="fas fa-search"></i></div>
        {% if user.is_authenticated %}
            <div class="user-menu-container">
                <div class="user-avatar-btn" id="userAvatarBtn" style="overflow: hidden; border: 2px solid rgba(255,255,255,0.1); border-radius: 50%;">
                    <img src="{% static 'images/candidate_profile_avatar.jpg' %}" alt="Profile Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <div class="user-dropdown-header" onclick="window.location.href='{% url 'profile_edit' %}'" style="cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='none'">
                        <strong>{{ user.first_name }} {{ user.last_name }}</strong>
                        <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5); display: block; margin-top: 3px;">{{ user.email }}</span>
                    </div>
                    <a href="{% url 'logout' %}" class="user-dropdown-item logout-item">
                        <i class="fas fa-sign-out-alt"></i> Log Out
                    </a>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="login-btn">Log In</a>
        {% endif %}
    </div>
</nav>
