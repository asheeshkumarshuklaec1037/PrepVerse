{% load static %}
<div class="avatar-box {{ extra_class }}" style="overflow: hidden; border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; width: {{ size|default:'36px' }}; height: {{ size|default:'36px' }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: linear-gradient(135deg, var(--accent-blue), #8b5cf6);">
    {% if user.profile_picture %}
        <img src="{{ user.profile_picture.url }}" alt="{{ user.first_name }} {{ user.last_name }}" style="width: 100%; height: 100%; object-fit: cover;">
    {% else %}
        <img src="{% static 'images/candidate_profile_avatar.jpg' %}" alt="Profile Avatar" style="width: 100%; height: 100%; object-fit: cover;">
    {% endif %}
</div>
