{% load static %}
{% if user.is_authenticated %}
<!-- Sidebar Menu drawer -->
<aside class="sidebar-menu" id="sidebarMenu">
    <div class="sidebar-header">
        <a href="{% url 'home' %}" class="sidebar-brand">
            <i class="fa-solid fa-bolt-lightning"></i>
        </a>
    </div>
    
    <div class="sidebar-user" onclick="window.location.href='{% url 'profile_edit' %}'" style="cursor: pointer;">
        <div class="sidebar-user-avatar" data-title="{{ user.first_name }} {{ user.last_name }}">
            <img src="{% static 'images/candidate_profile_avatar.jpg' %}" alt="Profile Avatar" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div class="sidebar-user-info">
            <span class="sidebar-user-name">Hey, {{ user.first_name }}!</span>
            <span style="font-size: 0.72rem; color: var(--accent-green); font-weight: 600; font-family: var(--mono); opacity: 0.85;">Manage Profile ↗</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="sidebar-link" data-sidebar-route="dashboard" data-title="Dashboard">
            <i class="fa-solid fa-compass"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'mock_history' %}" class="sidebar-link" data-sidebar-route="mock-history" data-title="Test Performance">
            <i class="fa-solid fa-chart-line"></i>
            <span>Test Performance</span>
        </a>
        <a href="{% url 'leaderboard' %}" class="sidebar-link" data-sidebar-route="leaderboard" data-title="Leaderboard">
            <i class="fa-solid fa-trophy"></i>
            <span>Leaderboard</span>
        </a>
        <a href="{% url 'bookmarks' %}" class="sidebar-link" data-sidebar-route="bookmarks" data-title="Bookmarks">
            <i class="fa-solid fa-bookmark"></i>
            <span>Bookmarks</span>
        </a>
        <a href="{% url 'calendar' %}" class="sidebar-link" data-sidebar-route="calendar" data-title="Calendar">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Calendar</span>
        </a>
        <a href="{% url 'notifications' %}" class="sidebar-link" data-sidebar-route="notifications" data-title="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span>Notifications</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="{% url 'logout' %}" class="sidebar-logout" data-title="Log Out">
            <i class="fa-solid fa-power-off"></i>
            <span>Log Out</span>
        </a>
    </div>
</aside>
{% endif %}
